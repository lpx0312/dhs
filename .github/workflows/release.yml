name: Release

# 推送 v 开头的 tag 时触发（如 v0.1.0、v0.2.0），自动交叉编译并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # GITHUB_TOKEN 需要 release 写权限以创建 Release 并上传资源

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Go（版本自动读取 go.mod）
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # 3. 交叉编译 linux/amd64 + linux/arm64（纯静态，无 C 依赖）
      - name: Cross-compile (linux/amd64 + linux/arm64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/dhs-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/dhs-linux-arm64 .
          echo "=== Build complete ==="
          ls -lh dist/

      # 4. 创建 GitHub Release 并上传二进制
      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dhs-linux-amd64
            dist/dhs-linux-arm64
